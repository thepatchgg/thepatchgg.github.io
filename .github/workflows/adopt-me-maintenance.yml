name: Adopt Me Maintenance

on:
  schedule:
    # Daily at 14:30 UTC, which is mid-morning Eastern during daylight time.
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run refresh and guardrails without committing changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: adopt-me-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: windows-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git author
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run automated maintenance
        shell: pwsh
        run: |
          $dryRun = "${{ github.event.inputs.dry_run }}" -eq "true"
          if ($dryRun) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-site-maintenance.ps1 -DryRun
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-site-maintenance.ps1 -Push
          }
