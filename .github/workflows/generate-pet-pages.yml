name: Generate Pet Pages
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate pet pages and sitemap
        run: |
          echo "" | base64 -d > gen.py
          python3 gen.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pets/ sitemap.xml
          git diff --staged --quiet || (git commit -m "feat: add 719 pet value pages + sitemap.xml [skip ci]" && git push)
