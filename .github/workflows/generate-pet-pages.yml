name: Generate Pet Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git author
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate pet pages and sitemap
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\generate-adopt-pet-pages.ps1

      - name: Run QA
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\qa-site.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\qa-release.ps1

      - name: Commit and push generated pages
        shell: pwsh
        run: |
          git add data/adopt-me-pet-pages.json pets/ sitemap.xml
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No generated page changes to commit."
            exit 0
          }

          git commit -m "Regenerate Adopt Me pet pages"
          git push origin HEAD:main
